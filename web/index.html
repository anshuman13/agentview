<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var themes = ['gradianto', 'dark-modern', 'light'];
        var wanted = new URLSearchParams(location.search).get('theme');
        if (themes.indexOf(wanted) >= 0) localStorage.setItem('agentview.theme', wanted);
        var stored = localStorage.getItem('agentview.theme');
        var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'gradianto';
        var theme = themes.indexOf(stored) >= 0 ? stored : system;
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f8f8f8');
      } catch (e) {
        document.documentElement.dataset.theme = 'gradianto';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a1a28" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgentView" />
    <title>AgentView</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
