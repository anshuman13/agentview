<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var bgs = { dark: '#181818', light: '#ffffff' };
        var old = { midnight: 'dark', aubergine: 'dark', forest: 'dark', gradianto: 'dark', 'dark-modern': 'dark', 'solarized-dark': 'dark', paper: 'light', 'solarized-light': 'light' };
        var wanted = new URLSearchParams(location.search).get('theme');
        if (bgs[wanted]) localStorage.setItem('agentview.theme', wanted);
        var stored = localStorage.getItem('agentview.theme');
        if (old[stored]) localStorage.setItem('agentview.theme', (stored = old[stored]));
        var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var theme = bgs[stored] ? stored : system;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bgs[theme]);
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#181818" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgentView" />
    <title>AgentView</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
