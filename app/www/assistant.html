<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Assistant</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #181818;
        color: #cccccc;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        grid-template-rows: 1fr auto;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }
      #content {
        overflow-y: auto;
        overflow-x: hidden;
        padding: max(12px, env(safe-area-inset-top)) 12px 12px max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }
      #nav {
        display: flex;
        justify-content: space-around;
        border-top: 1px solid #3c3c3c;
        padding-top: max(8px, env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        gap: 4px;
        margin: 0 max(0px, env(safe-area-inset-left)) 0 max(0px, env(safe-area-inset-right));
      }
      button { font: inherit; border: 0; background: none; color: #9d9d9d; padding: 8px; cursor: pointer; }
      button.active { color: #0078d4; }
      [hidden] { display: none !important; }
      .screen { display: none; }
      .screen.active { display: block; }

      input, textarea { font: inherit; background: #313131; color: #e7e7e7; border: 1px solid #3c3c3c; border-radius: 4px; padding: 10px; }
      input:focus, textarea:focus { outline: none; border-color: #0078d4; }
      button.primary { background: #0078d4; color: #fff; height: 36px; border-radius: 4px; padding: 0 12px; }
      button.secondary { background: #313131; color: #e7e7e7; height: 36px; border-radius: 4px; padding: 0 12px; }
      button:disabled { opacity: 0.6; }
      p { margin: 0; color: #9d9d9d; font-size: 12px; }

      #lock-screen {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
        text-align: center;
      }
      #lock-screen h1 { margin: 0; font-size: 18px; color: #e7e7e7; font-weight: 600; }
      #lock-screen p { margin: 0 0 20px; }
      #lock-screen button { width: 100%; }

      .task-row {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: #313131;
        border-radius: 4px;
        margin-bottom: 8px;
        align-items: flex-start;
      }
      .task-content { flex: 1; }
      .task-title { font-weight: 500; color: #e7e7e7; margin: 0 0 4px; }
      .task-tag { display: inline-block; font-size: 11px; padding: 2px 6px; background: #3c3c3c; border-radius: 3px; color: #9d9d9d; margin-bottom: 4px; }
      .task-actions {
        display: flex;
        gap: 4px;
      }
      .task-actions button { padding: 4px 8px; font-size: 12px; background: #3c3c3c; color: #e7e7e7; border-radius: 3px; }

      .filters {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
      }
      .filter-chip {
        padding: 6px 12px;
        border-radius: 16px;
        border: 1px solid #3c3c3c;
        background: transparent;
        color: #9d9d9d;
        cursor: pointer;
        white-space: nowrap;
      }
      .filter-chip.active {
        background: #0078d4;
        border-color: #0078d4;
        color: #fff;
      }

      .section-title {
        font-size: 12px;
        color: #9d9d9d;
        font-weight: 500;
        margin: 16px 0 8px;
        text-transform: uppercase;
      }

      #capture { display: flex; flex-direction: column; gap: 12px; }
      #capture textarea { height: 150px; resize: vertical; }
      .toggle-group { display: flex; gap: 8px; }
      .toggle-group button { flex: 1; height: 36px; }
      .toggle-group button.active { background: #0078d4; color: #fff; }

      #notes { display: flex; flex-direction: column; gap: 8px; }
      .note-item {
        background: #313131;
        border-radius: 4px;
        padding: 12px;
        cursor: pointer;
      }
      .note-item.expanded {
        background: #2a2a2a;
      }
      .note-item-title { font-weight: 500; color: #e7e7e7; margin-bottom: 4px; }
      .note-item-text { color: #9d9d9d; font-size: 12px; margin-bottom: 8px; }
      .note-item button { padding: 4px 8px; font-size: 12px; }

      #settings { display: flex; flex-direction: column; gap: 12px; }
      .setting-group { display: flex; flex-direction: column; gap: 4px; }
      .setting-group label { font-size: 12px; color: #9d9d9d; font-weight: 500; }
      #settings input { width: 100%; }
      #settings .actions { display: flex; gap: 8px; }
      #settings .actions button { flex: 1; }
      .status-text { font-size: 11px; color: #9d9d9d; }
      #settings a { color: #3794ff; text-decoration: none; font-size: 12px; }

      .confirmation { font-size: 12px; color: #0078d4; }
    </style>
  </head>
  <body>
    <div id="lock-screen" hidden>
      <h1>Unlock</h1>
      <p id="lock-msg">Tap to unlock with fingerprint</p>
      <button id="unlock-btn" class="primary" style="width: 100%;">Unlock</button>
      <button id="retry-btn" class="secondary" style="width: 100%;" hidden>Retry</button>
    </div>
    <div id="content">
      <div id="today" class="screen active">
        <div class="filters" id="filters"></div>
        <div id="today-list"></div>
        <div class="section-title" id="later-title" hidden>Later</div>
        <div id="later-list"></div>
      </div>

      <div id="capture" class="screen">
        <textarea id="capture-text" placeholder="What's on your mind?" autofocus></textarea>
        <div class="toggle-group">
          <button id="task-toggle" class="active">Task</button>
          <button id="note-toggle">Note</button>
        </div>
        <div class="toggle-group">
          <button id="work-toggle" class="active">Work</button>
          <button id="personal-toggle">Personal</button>
        </div>
        <button id="save-btn" class="primary">Save</button>
        <div class="confirmation" id="save-confirm"></div>
      </div>

      <div id="notes" class="screen"></div>

      <div id="settings" class="screen">
        <div class="setting-group">
          <label>Hub URL</label>
          <input id="hub-url" type="url" placeholder="http://my-mini.netbird.cloud:7790" />
        </div>
        <div class="setting-group">
          <label>Device Key</label>
          <input id="device-key" type="password" placeholder="64-char hex key" />
        </div>
        <div class="actions">
          <button id="settings-save" class="primary">Save</button>
          <button id="sync-now" class="secondary">Sync now</button>
        </div>
        <p class="status-text" id="sync-status"></p>
        <a href="index.html#agentview" onclick="localStorage.setItem('agentview.start', 'agentview')">AgentView</a>
      </div>
    </div>

    <nav id="nav">
      <button id="today-tab" class="active" data-tab="today">Today</button>
      <button id="capture-tab" data-tab="capture">Capture</button>
      <button id="notes-tab" data-tab="notes">Notes</button>
      <button id="settings-tab" data-tab="settings">Settings</button>
    </nav>

    <script type="module" src="assistant.js"></script>
  </body>
</html>
