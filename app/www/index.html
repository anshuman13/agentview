<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AgentView</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #181818;
        color: #cccccc;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      form { width: min(360px, calc(100vw - 32px)); display: grid; gap: 12px; text-align: center; }
      img { width: 64px; height: 64px; margin: 0 auto; border-radius: 14px; }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: #e7e7e7; }
      input {
        height: 36px;
        padding: 0 10px;
        font: inherit;
        font-size: 15px;
        color: #e7e7e7;
        background: #313131;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
        outline: none;
      }
      input:focus { border-color: #0078d4; }
      button { height: 36px; font: inherit; font-size: 14px; color: #fff; background: #0078d4; border: 0; border-radius: 4px; }
      button:disabled { opacity: 0.6; }
      p { min-height: 18px; margin: 0; color: #9d9d9d; }
      button.secondary { background: #313131; }
      #macs { display: grid; gap: 8px; }
      #macs button { width: 100%; }
      a { color: #3794ff; font-size: 12px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="form">
      <img src="icon.png" alt="" />
      <h1 id="title">AgentView</h1>
      <input id="url" hidden placeholder="http://192.168.1.10:5173" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" />
      <button id="go" hidden>Connect</button>
      <button id="netbird" class="secondary" hidden>Open NetBird</button>
      <button id="retry" hidden>Retry</button>
      <div id="macs" hidden></div>
      <p id="msg"></p>
      <a id="other" href="#" hidden>Use another address</a>
    </form>
    <script>
      const MAC_URL = 'http://anshumans-macbook-pro.netbird.cloud:5173';
      const KEY = 'agentview.url';
      const android = /Android/i.test(navigator.userAgent);
      const phone = /Android|iPhone|iPad/i.test(navigator.userAgent);
      const shell = window.AgentViewShell;
      const known = (() => { try { return shell?.macs ? JSON.parse(shell.macs()) : []; } catch { return []; } })();
      const saved = known[0]?.url || localStorage.getItem(KEY) || (phone ? MAC_URL : 'http://localhost:5173');
      const $ = (id) => document.getElementById(id);
      const [form, url, go, msg, netbird, retry, other, h1, macs] = ['form', 'url', 'go', 'msg', 'netbird', 'retry', 'other', 'title', 'macs'].map($);
      url.value = saved;
      let current = saved;
      let busy = false;
      const build = fetch('build.txt').then((r) => (r.ok ? r.text() : '')).then((t) => t.trim()).catch(() => '');

      async function reachable(u) {
        const abort = new AbortController();
        const timer = setTimeout(() => abort.abort(), 4000);
        try {
          await fetch(`${u}/api/connect`, { mode: 'no-cors', signal: abort.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      function show(unreachable, manual) {
        h1.textContent = unreachable ? "Can't reach your Mac" : 'AgentView';
        netbird.hidden = retry.hidden = !(unreachable && android);
        other.hidden = !(unreachable && android) || manual;
        url.hidden = go.hidden = !(manual || (unreachable && !android));
        go.disabled = false;
        macs.replaceChildren(...known.filter((m) => m.url !== current).map((m) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'secondary';
          b.textContent = m.name || m.url;
          b.onclick = () => connect(m.url, false);
          return b;
        }));
        macs.hidden = !(unreachable || manual) || !macs.childElementCount;
      }

      async function connect(raw, manual) {
        let u = raw.trim().replace(/\/+$/, '');
        if (!u || busy) return;
        if (!/^https?:\/\//.test(u)) u = `http://${u}`;
        busy = true;
        current = u;
        go.disabled = true;
        msg.textContent = `Connecting to ${u}`;
        const ok = await reachable(u);
        busy = false;
        if (ok) {
          localStorage.setItem(KEY, u);
          const b = await build;
          location.replace(b ? `${u}/?shell=${b}` : u);
          return;
        }
        show(true, manual);
        msg.textContent = android
          ? 'NetBird must be connected and AgentView running on your Mac.'
          : `Can't reach ${u}. Is AgentView running?`;
      }

      form.onsubmit = (e) => {
        e.preventDefault();
        connect(url.value, true);
      };
      retry.onclick = () => connect(current, !url.hidden);
      netbird.onclick = () => {
        if (shell?.launch) {
          if (!shell.launch('io.netbird.client')) msg.textContent = 'NetBird is not installed.';
        } else location.href = 'intent://#Intent;package=io.netbird.client;end';
      };
      other.onclick = (e) => {
        e.preventDefault();
        show(true, true);
        url.focus();
      };
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') connect(current, !url.hidden);
      });
      connect(saved, false);
    </script>
  </body>
</html>
