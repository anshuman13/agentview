<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AgentView</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #181818;
        color: #cccccc;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      form { width: min(360px, calc(100vw - 32px)); display: grid; gap: 12px; text-align: center; }
      img { width: 64px; height: 64px; margin: 0 auto; border-radius: 14px; }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: #e7e7e7; }
      input {
        height: 36px;
        padding: 0 10px;
        font: inherit;
        font-size: 15px;
        color: #e7e7e7;
        background: #313131;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
        outline: none;
      }
      input:focus { border-color: #0078d4; }
      button { height: 36px; font: inherit; font-size: 14px; color: #fff; background: #0078d4; border: 0; border-radius: 4px; }
      button:disabled { opacity: 0.6; }
      p { min-height: 18px; margin: 0; color: #9d9d9d; }
      button.secondary { background: #313131; }
      #macs { display: grid; gap: 8px; }
      #macs button { width: 100%; }
      a { color: #3794ff; font-size: 12px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="form">
      <img src="icon.png" alt="" />
      <h1 id="title">AgentView</h1>
      <input id="url" hidden placeholder="http://my-mac.netbird.cloud:5173" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" />
      <button id="go" hidden>Connect</button>
      <button id="netbird" class="secondary" hidden>Open NetBird</button>
      <button id="retry" hidden>Retry</button>
      <div id="macs" hidden></div>
      <p id="msg"></p>
      <a id="other" href="#" hidden>Use another address</a>
    </form>
    <script>
      const MAC_URL = 'http://anshumans-macbook-pro.netbird.cloud:5173';
      const KEY = 'agentview.url';
      const android = /Android/i.test(navigator.userAgent);
      const shell = window.AgentViewShell;
      const TRUSTED = /^http:\/\/([a-z0-9-]+\.netbird\.cloud|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d+\.\d+|localhost)(:\d{1,5})?$/i;
      const known = shell ? JSON.parse(shell.macs()).filter((m) => TRUSTED.test(m.url)) : [];
      const saved = known[0]?.url || localStorage.getItem(KEY) || (android ? MAC_URL : 'http://localhost:5173');
      const [form, url, go, msg, netbird, retry, other, h1, macs] = ['form', 'url', 'go', 'msg', 'netbird', 'retry', 'other', 'title', 'macs'].map((id) => document.getElementById(id));
      url.value = saved;
      let current = saved;
      let busy = false;
      const build = fetch('build.txt').then(async (r) => (r.ok ? (await r.text()).trim() : '')).catch(() => '');

      async function reachable(u) {
        try {
          await fetch(`${u}/api/connect?peer=1`, { mode: 'no-cors', signal: AbortSignal.timeout(4000) });
          return true;
        } catch {
          return false;
        }
      }

      function show(manual) {
        h1.textContent = "Can't reach your Mac";
        netbird.hidden = retry.hidden = !android;
        other.hidden = !android || manual;
        url.hidden = go.hidden = android && !manual;
        go.disabled = false;
        macs.replaceChildren(...known.filter((m) => m.url !== current).map((m) => Object.assign(document.createElement('button'), { type: 'button', className: 'secondary', textContent: m.name || m.url, onclick: () => connect(m.url, false) })));
        macs.hidden = !macs.childElementCount;
      }

      async function connect(raw, manual) {
        let u = raw.trim().replace(/\/+$/, '');
        if (!u || busy) return;
        if (!/^https?:\/\//.test(u)) u = `http://${u}`;
        if (shell && !TRUSTED.test(u)) return (msg.textContent = "Use your Mac's NetBird address.");
        busy = true;
        current = u;
        go.disabled = true;
        msg.textContent = `Connecting to ${u}`;
        if (await reachable(u)) {
          localStorage.setItem(KEY, u);
          const b = await build;
          return location.replace(b ? `${u}/?shell=${b}` : u);
        }
        busy = false;
        show(manual);
        msg.textContent = android ? 'NetBird must be connected and AgentView running on your Mac.' : `Can't reach ${u}. Is AgentView running?`;
      }

      form.onsubmit = (e) => {
        e.preventDefault();
        connect(url.value, true);
      };
      retry.onclick = () => connect(url.hidden ? current : url.value, !url.hidden);
      netbird.onclick = () => {
        if (!shell?.launch('io.netbird.client')) msg.textContent = 'NetBird is not installed.';
      };
      other.onclick = (e) => {
        e.preventDefault();
        show(true);
        url.focus();
      };
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') connect(current, !url.hidden);
      });
      connect(saved, false);
    </script>
  </body>
</html>
